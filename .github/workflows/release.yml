name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/publish (e.g. 0.10.6). Leave empty to only build artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Resolve tag / version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PUBLISH=true
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
            PUBLISH=true
          else
            TAG=""
            PUBLISH=false
          fi

          # Wheel/PyPI version cannot have a leading v.
          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag='${TAG}' version='${VERSION}' publish=${PUBLISH}"

  build_sdist:
    name: Build sdist
    needs: meta
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -U pip build

      - name: Show resolved version
        run: python setup.py --version

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PACKAGE_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show resolved version
        shell: bash
        run: python setup.py --version

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          # Config also lives in pyproject.toml; env keeps CI explicit.
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_* *t-*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # Pass version into isolated build envs (tag is source of truth).
          CIBW_ENVIRONMENT: PACKAGE_VERSION="${{ needs.meta.outputs.version }}"
          # Keep macOS wheels portable (setup.py used to pin host OS, e.g. 26.x).
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET="11.0" PACKAGE_VERSION="${{ needs.meta.outputs.version }}"
          # Belt-and-suspenders for MSVC string_view / C++17
          CIBW_ENVIRONMENT_WINDOWS: CL="/std:c++17" PACKAGE_VERSION="${{ needs.meta.outputs.version }}"
          CIBW_TEST_COMMAND: python -c "import fasttext; print('fasttext OK')"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish_release:
    name: GitHub Release
    needs: [meta, build_sdist, build_wheels]
    runs-on: ubuntu-latest
    if: needs.meta.outputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.whl
            artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
